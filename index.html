<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calorie Tracker</title>
    <meta name="apple-mobile-web-app-title" content="Calorie Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Track calories, macros, and weight with AI-powered meal estimation." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Applied before paint, ahead of React mounting, so there's no flash
      // of the light theme while the app's own ThemeProvider initializes.
      (function () {
        try {
          var pref = localStorage.getItem('calorie_tracker_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Launch splash. Shared by the static copy below (painted before any
         JS loads) and the React SplashScreen that takes over, so the hand-off
         is seamless. */
      .splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F4F5F6; transition: opacity .35s ease, transform .35s ease; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif; }
      .dark .splash { background: #0B0D10; }
      .splash.splash-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .splash-logo { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; animation: splashPop .6s cubic-bezier(.2,.9,.3,1.2) both; }
      .splash-glow { position: absolute; inset: 10px; border-radius: 9999px; background: radial-gradient(circle, rgba(249,115,22,.28), rgba(5,150,105,0) 70%); animation: splashGlow 1.8s ease-in-out infinite; }
      .splash-ring { position: absolute; inset: 0; animation: splashSpin 1.4s linear infinite; }
      .splash-ring circle.arc { stroke-dasharray: 90 400; animation: splashDash 1.4s ease-in-out infinite; }
      .splash-icon { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px -8px rgba(5,150,105,.55); }
      .splash-flame { transform-origin: 256px 420px; animation: splashFlicker 1.2s ease-in-out infinite alternate; }
      .splash-title { margin-top: 22px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #111827; animation: splashUp .5s .15s ease-out both; }
      .dark .splash-title { color: #fff; }
      .splash-sub { margin-top: 6px; font-size: 13px; font-weight: 500; color: #9CA3AF; animation: splashUp .5s .3s ease-out both; }
      .splash-dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
      .splash-dots i { width: 4px; height: 4px; border-radius: 9999px; background: #10B981; animation: splashDot 1s ease-in-out infinite; }
      .splash-dots i:nth-child(2) { animation-delay: .15s; }
      .splash-dots i:nth-child(3) { animation-delay: .3s; }
      @keyframes splashPop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splashGlow { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes splashSpin { to { transform: rotate(360deg); } }
      @keyframes splashDash { 0% { stroke-dasharray: 20 400; } 50% { stroke-dasharray: 200 400; } 100% { stroke-dasharray: 20 400; stroke-dashoffset: -390; } }
      @keyframes splashFlicker { from { transform: scale(1, 1) skewX(0deg); } to { transform: scale(.97, 1.06) skewX(-2deg); } }
      @keyframes splashUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes splashDot { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-3px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-glow, .splash-ring, .splash-ring circle.arc, .splash-flame, .splash-title, .splash-sub, .splash-dots i { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-label="Loading Calorie Tracker" role="status">
        <div class="splash-logo">
          <div class="splash-glow"></div>
          <svg class="splash-ring" viewBox="0 0 132 132" width="132" height="132" aria-hidden="true">
            <circle cx="66" cy="66" r="62" fill="none" stroke="rgba(16,185,129,.15)" stroke-width="4" />
            <circle class="arc" cx="66" cy="66" r="62" fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" />
          </svg>
          <svg class="splash-icon" viewBox="0 0 512 512" aria-hidden="true">
            <rect width="512" height="512" rx="112" fill="#059669" />
            <g class="splash-flame">
              <path d="M256 120c-18 38-46 58-46 98 0 28 20 50 46 50s46-22 46-50c0-18-8-30-20-48 0 16-8 26-20 26 0-30 20-56-6-76z" fill="#F97316" />
              <path d="M196 286c-12 18-20 34-20 56 0 44 36 80 80 80s80-36 80-80c0-22-8-38-20-56-4 24-18 40-38 40 0-28-40-40-82-40z" fill="#FB923C" opacity="0.9" />
            </g>
          </svg>
        </div>
        <div class="splash-title">Calorie Tracker</div>
        <div class="splash-sub">Getting your day ready<span class="splash-dots"><i></i><i></i><i></i></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
