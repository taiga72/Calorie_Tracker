<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calorie Tracker</title>
    <meta name="apple-mobile-web-app-title" content="Calorie Tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Track calories, macros, and weight with AI-powered meal estimation." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Applied before paint, ahead of React mounting, so there's no flash
      // of the light theme while the app's own ThemeProvider initializes.
      (function () {
        try {
          var pref = localStorage.getItem('calorie_tracker_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          // Appearance (accent, text size, background…), as applyAppearance()
          // in src/lib/appearance.ts does once the app loads.
          var a = JSON.parse(localStorage.getItem('calorie_tracker_appearance') || '{}');
          var r = document.documentElement;
          if (a.accent) r.dataset.accent = a.accent;
          if (a.density) r.dataset.density = a.density;
          if (a.background) r.dataset.bg = a.background;
          if (a.cardStyle) r.dataset.card = a.cardStyle;
          if (a.darkStyle) r.dataset.darkStyle = a.darkStyle;
          var fs = { large: 1.1, xlarge: 1.2 }[a.textSize];
          if (fs) r.style.setProperty('--fs', String(fs));
        } catch (e) {}
      })();
    </script>
    <style>
      /* Launch skeleton: the shape of Home, shown until the data is ready.
         Shared by the static copy below (painted before any JS loads) and
         the React SplashScreen that takes over, so the hand-off is seamless. */
      .splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #F4F5F6; transition: opacity .25s ease; }
      .dark .splash { background: #0B0D10; }
      .dark[data-dark-style="black"] .splash { background: #000; }
      .splash.splash-out { opacity: 0; pointer-events: none; }
      .sk-page { max-width: 28rem; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 24px) 20px 0; }
      .sk-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
      .sk-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
      .sk-col { display: grid; gap: 12px; }
      .sk-card { background: #fff; border: 1px solid #F9FAFB; border-radius: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); padding: 16px; margin-bottom: 12px; }
      .sk-row .sk-card { margin-bottom: 0; }
      .dark .sk-card { background: #111827; border-color: #1F2937; }
      .dark[data-dark-style="black"] .sk-card { background: #0e0e10; border-color: #202024; }
      .sk { background: #E9EBEE; border-radius: 9999px; position: relative; overflow: hidden; }
      .dark .sk { background: #1F2530; }
      .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); animation: skShimmer 1.3s ease-in-out infinite; }
      .dark .sk::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); }
      .sk-line { height: 10px; margin-top: 8px; }
      .sk-line:first-child { margin-top: 0; }
      .sk-title { height: 26px; width: 70%; margin-top: 10px; border-radius: 10px; }
      .sk-chip { width: 64px; height: 30px; }
      .sk-ring { width: 104px; height: 104px; margin: 14px auto 6px; border-radius: 9999px; background: none; border: 12px solid #E9EBEE; }
      .dark .sk-ring { border-color: #1F2530; background: none; }
      .sk-ring::after { display: none; }
      .sk-meal { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
      .sk-thumb { width: 44px; height: 44px; border-radius: 16px; flex-shrink: 0; }
      .sk-grow { flex: 1; }
      .sk-nav { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: calc(28rem - 32px); margin: 0 auto; height: 60px; border-radius: 9999px; background: rgba(255,255,255,.95); border: 1px solid #F3F4F6; box-shadow: 0 10px 15px -3px rgba(0,0,0,.1); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center; }
      .dark .sk-nav { background: rgba(17,24,39,.95); border-color: #1F2937; }
      .sk-nav .sk { width: 22px; height: 22px; border-radius: 7px; }
      .skw25 { width: 25%; } .skw40 { width: 40%; } .skw55 { width: 55%; } .skw70 { width: 70%; } .skw85 { width: 85%; }
      @keyframes skShimmer { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-label="Loading Calorie Tracker" role="status">
        <div class="sk-page" aria-hidden="true">
          <div class="sk-head"><div style="flex:1"><div class="sk sk-line skw40"></div><div class="sk sk-title"></div></div><div class="sk sk-chip"></div></div>
          <div class="sk-row">
            <div class="sk-card"><div class="sk sk-line skw70"></div><div class="sk sk-ring"></div><div class="sk sk-line skw55" style="margin:10px auto 0"></div></div>
            <div class="sk-col">
              <div class="sk-card"><div class="sk sk-line skw55"></div><div class="sk sk-line skw85" style="height:20px;margin-top:12px"></div><div class="sk sk-line skw40"></div></div>
              <div class="sk-card"><div class="sk sk-line skw55"></div><div class="sk sk-line skw85"></div><div class="sk sk-line skw70"></div><div class="sk sk-line skw85"></div></div>
            </div>
          </div>
          <div class="sk-card"><div class="sk sk-line skw40"></div><div class="sk sk-line skw85"></div></div>
          <div class="sk-card">
            <div class="sk sk-line skw25"></div>
            <div class="sk-meal"><div class="sk sk-thumb"></div><div class="sk-grow"><div class="sk sk-line skw70"></div><div class="sk sk-line skw40"></div></div></div>
            <div class="sk-meal"><div class="sk sk-thumb"></div><div class="sk-grow"><div class="sk sk-line skw55"></div><div class="sk sk-line skw40"></div></div></div>
          </div>
        </div>
        <div class="sk-nav" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
